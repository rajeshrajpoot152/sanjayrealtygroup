<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquire Now | Sanjay Realty Group</title>
    <meta name="description" content="Inquire about premium land parcels in India, the USA, and the UK with Sanjay Realty Group.">
    <link rel="icon" href="images/favicon.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0F172A',
                            gold: '#D4AF37',
                            gray: '#F8FAFC',
                        }
                    },
                    backgroundImage: {
                        'hero-pattern': "url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80')",
                    }
                }
            }
        }
    </script>
    
    <style>
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="font-sans text-gray-800 bg-brand-gray antialiased selection:bg-brand-gold selection:text-brand-navy overflow-x-hidden">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-24">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="flex flex-col">
                        <span class="font-serif text-2xl font-bold text-white tracking-wider">SANJAY <span class="text-brand-gold">REALTY</span></span>
                        <span class="text-xs text-gray-400 tracking-[0.2em] uppercase mt-1">Global Land Group</span>
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white font-medium text-sm tracking-wide transition-colors">Home</a>
                    <a href="about.html" class="text-gray-300 hover:text-white font-medium text-sm tracking-wide transition-colors">Our Story</a>
                    <a href="properties.html" class="text-gray-300 hover:text-white font-medium text-sm tracking-wide transition-colors">Global Parcels</a>
                    <a href="gallery.html" class="text-gray-300 hover:text-white font-medium text-sm tracking-wide transition-colors">Gallery</a>
                    <a href="contact.html" class="text-gray-300 hover:text-white font-medium text-sm tracking-wide transition-colors">Contact</a>
                    <a href="inquiry.html" class="bg-brand-gold text-brand-navy px-6 py-2.5 rounded-sm font-semibold text-sm transition-all shadow-[0_0_15px_rgba(212,175,55,0.3)]">
                        Inquire Now
                    </a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <section class="min-h-screen pt-32 pb-24 flex items-center justify-center bg-brand-navy relative overflow-hidden">
        <div class="absolute inset-0 bg-hero-pattern bg-cover bg-center opacity-10 mix-blend-overlay"></div>
        <div class="max-w-3xl w-full mx-auto px-4 relative z-10">
            <div class="bg-white rounded-xl shadow-2xl p-8 md:p-12">
                <div class="text-center mb-8">
                    <h1 class="font-serif text-3xl md:text-4xl font-bold text-brand-navy mb-3">Investment Inquiry</h1>
                    <p class="text-gray-500">Provide details about your investment goals, and our global land experts will contact you shortly.</p>
                </div>
                
                <form action="thank-you.html" method="GET">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">First Name</label>
                                <input type="text" class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all" required>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Last Name</label>
                                <input type="text" class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all" required>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                                <input type="email" class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all" required>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Phone / WhatsApp</label>
                                <input type="tel" class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all" required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Region of Interest</label>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded cursor-pointer hover:border-brand-gold transition-colors">
                                    <input type="checkbox" class="text-brand-gold focus:ring-brand-gold w-4 h-4" value="India">
                                    <span class="text-sm font-medium text-gray-700">India</span>
                                </label>
                                <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded cursor-pointer hover:border-brand-gold transition-colors">
                                    <input type="checkbox" class="text-brand-gold focus:ring-brand-gold w-4 h-4" value="USA">
                                    <span class="text-sm font-medium text-gray-700">USA</span>
                                </label>
                                <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded cursor-pointer hover:border-brand-gold transition-colors">
                                    <input type="checkbox" class="text-brand-gold focus:ring-brand-gold w-4 h-4" value="UK">
                                    <span class="text-sm font-medium text-gray-700">UK</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Target Investment Range</label>
                            <select class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all text-gray-700">
                                <option>Select Range</option>
                                <option>Under $1 Million / ₹8 Crore</option>
                                <option>$1M - $5M / ₹8Cr - ₹40Cr</option>
                                <option>$5M+ / ₹40Cr+</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Additional Details</label>
                            <textarea rows="4" class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-200 focus:border-brand-gold focus:ring-1 focus:ring-brand-gold outline-none transition-all resize-none" placeholder="Specific requirements, land size, usage (agricultural, commercial, residential)..."></textarea>
                        </div>

                        <button type="submit" class="w-full bg-brand-navy hover:bg-gray-900 text-brand-gold px-8 py-4 rounded font-bold uppercase tracking-wider transition-colors mt-4">
                            Submit Inquiry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-brand-navy text-white py-8 border-t border-gray-800 text-center">
        <p class="text-gray-500 text-sm">&copy; 2026 Sanjay Realty Group. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
